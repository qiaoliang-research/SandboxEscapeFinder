[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-escape-finder"
version = "0.1.0"
description = "Static + dynamic escape finder for Python sandboxes (STAR Task 6)"
requires-python = ">=3.10"
dependencies = ["RestrictedPython>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
